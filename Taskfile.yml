# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  setup:
    desc: setup
    cmds:
      - |
        export LANG=C
        yes | yay -S \
          fish \
          ttf-firacode-nerd \
          neovim \
          neovide \
          git-delta \
          lazygit \
          xsel \
          xclip \
          firefox-tridactyl-native-bin \
          chezmoi
        mkdir -p ~/.config/konsave

  setup:locale:
    desc: "fix locale settings"
    cmds:
      - sudo sed -i 's/#en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen && sudo locale-gen


  kde:
    desc: install kde
    cmds:
        - |
          yes | yay -S $(eos-packagelist KDE-Desktop)
          yes | yay -S stl-thumb-kde        

  sddm:
    desc: enable sddm login manager
    cmds:
      - systemctl disable gdm
      - systemctl enable sddm


  fish:
    desc: configure fish
    sh: fish
    cmds:
      - |
        curl -sL https://git.io/fisher | source && fisher install jorgebucaran/fisher
        fisher update
        fish_update_completions
        fisher install Asim-Tahir/docker-compose.fish
        fisher install edc/bass
        fisher install realiserad/fish-ai
      - task fish:autoenv


  fish:autoenv:
    sh: fish
    cmds:
      - |
        fisher install aohorodnyk/fish-autovenv
        set -U autovenv_enable yes
        set -U autovenv_announce yes
        set -U autovenv_dir .venv


  save:
    desc: save deafult profile
    cmds:
      - konsave -s default -f
      - konsave -e default -d /tmp

  load:
    desc: load profile from file
    cmds:
      - konsave -i {{.CLI_ARGS}}
      - konsave -a default

  ssh-agent:
    desc: enable ssh agent as service
    cmds:
      - |
        mkdir -p ~/.config/environment.d/
        echo 'SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/ssh-agent.socket"' > ~/.config/environment.d/ssh_auth_socket.conf
        systemctl --user enable --now ssh-agent

        grep -q  AddKeysToAgent  ~/.ssh/config || echo 'AddKeysToAgent  yes' >> ~/.ssh/config

  neovim:clean:
    desc: clean neovim config
    cmds:
      - rm -fR ~/.config/nvim
      - rm -fR ~/.local/*/nvim ~/.cache/nvim

  neovim:
    desc: setup neovim
    cmds:
      - sudo pacman -S --needed neovim unzip luarocks xclip wl-clipboard
      - git clone git@github.com:scipioni/nvim.git ~/.config/nvim && nvim 
      #- git clone https://github.com/LazyVim/starter ~/.config/nvim && nvim

  user-dir:
    desc: set home folders name
    cmds:
      - echo "en_US" > ~/.config/user-dirs.locale
      - xdg-user-dirs-update --force

  chezmoi:init:
    desc: setup chezmoi on new machine
    cmds:
      - chezmoi init cubo:~/dotfiles.git
      - chezmoi apply

  cosmic:fcitx5:
    desc: fcitx5 input method on COSMIC (dead keys us+intl in GTK4/Ghostty), see cosmic/fcitx5.md
    cmds:
      - sudo pacman -S --needed --noconfirm fcitx5 fcitx5-gtk fcitx5-qt fcitx5-configtool
      - mkdir -p ~/.config/fcitx5 ~/.config/environment.d
      - cp cosmic/fcitx5/profile ~/.config/fcitx5/profile
      - cp cosmic/fcitx5/fcitx5.conf ~/.config/environment.d/fcitx5.conf
      - rm -f ~/.config/environment.d/gtk-im.conf
      - echo "logout/login to apply"

  cosmic:minimon:
    desc: system monitor applet (minimon) in COSMIC panel, see cosmic/minimon.md
    cmds:
      - yay -S --needed --noconfirm --removemake cosmic-ext-applet-minimon
      # the Flatpak with the same id would take precedence and can't see NVIDIA GPUs (see cosmic/minimon.md)
      - flatpak uninstall --user -y io.github.cosmic_utils.minimon-applet 2>/dev/null || true
      - |
        d=~/.config/cosmic/com.system76.CosmicPanel.Panel/v1
        f=$d/plugins_wings
        mkdir -p $d
        [ -f $f ] || cp /usr/share/cosmic/com.system76.CosmicPanel.Panel/v1/plugins_wings $f
        grep -q minimon-applet $f || perl -0pi -e 's/\]\s*,\s*\[/], [\n    "io.github.cosmic_utils.minimon-applet",/' $f

  gnome:save:
    desc: save settings
    cmds:
      - dconf dump /org/gnome/settings-daemon/plugins/media-keys/ > gnome/custom-keys.dconf

  gnome:load:
    desc: load settings
    cmds:
      - dconf load /org/gnome/settings-daemon/plugins/media-keys/ < gnome/custom-keys.dconf
      - dconf write /org/gnome/shell/extensions/clipboard-indicator/toggle-menu "['<Alt>v']"
      - dconf write /org/gnome/shell/extensions/pano/global-shortcut "['<Alt>v']"
      - xdg-mime default nemo.desktop inode/directory x-scheme-handler/file
      - gsettings set org.gnome.desktop.background show-desktop-icons false

