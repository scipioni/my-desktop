# fcitx5 come input method su COSMIC (Wayland, input-method-v2).
# GTK3/GTK4: nessun GTK_IM_MODULE, usano il protocollo Wayland text-input-v3.
# Qt >= 6.7: prova prima il protocollo Wayland, poi il modulo fcitx.
QT_IM_MODULES=wayland;fcitx
QT_IM_MODULE=fcitx
# App X11/XWayland (Electron in X11, vecchie app) e SDL.
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
